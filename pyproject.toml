[project]
name = "node-app"
version = "0.1.0"
description = "REST sidecar that drives Postfix + OpenDKIM through their command-line tools"
readme = "README.md"
authors = [
    { name = "adib-the-noob", email = "mdadib550@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.uv.build-backend]
module-name = "app"
module-root = ""
